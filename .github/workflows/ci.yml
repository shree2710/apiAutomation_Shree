name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Validates that every refactored class (API + UI) compiles.
      - name: Compile main and test sources
        run: mvn -B clean test-compile

  test:
    name: Run CI test suite
    runs-on: ubuntu-latest   # ships with Google Chrome; Selenium Manager fetches the driver
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show Chrome version
        run: google-chrome --version || true

      # Headless is already the config default; set explicitly so CI is unambiguous.
      - name: Run TestNG CI suite
        run: mvn -B test -Dsurefire.suiteXmlFiles=testng-ci.xml -Dui.headless=true

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
